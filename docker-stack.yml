services:
  django:
    image: pollapp:v6
    environment:
      - DBNAME=pollapp2
      - DBUSER=resil
      - DBPASSWORD=${DBPASSWORD}
      - DBHOST=postgres
      - DBPORT=5432

    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

      update_config:
        parallelism: 1
        delay: 10s

      rollback_config:
        parallelism: 1

      # placement:
      #   constraints:
      #     - node.role == manager

    networks:
      - backend

    volumes:
      - static_data:/app/static

  
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${DBPASSWORD}
      POSTGRES_USER: ${DBUSER}
      POSTGRES_DB: ${DBNAME}
    
    volumes:
      - postgres_data:/var/lib/postgresql
    
    networks:
      - backend
  
  redis:
    image: redis

    networks:
      - backend
    
    deploy:
      replicas: 1
  
  nginx:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - static_data:/static
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    
    networks:
      - backend
    
    depends_on:
      - django

networks:
  backend:
    driver: overlay


volumes:
  postgres_data:
  static_data: