apiVersion: v1
kind: Pod

metadata:
  name: postgres
  labels:
    app: postgres

spec:
  containers:
    - name: postgres
      image: postgres:16

      ports:
        - containerPort: 5432
    
      env:
        - name: POSTGRES_DB
          value: "test_db"

        - name: POSTGRES_USER
          value: "resil"

        - name: POSTGRES_PASSWORD
          value: "password"