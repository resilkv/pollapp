name: Django CI. # Workflow name

on:
  push:   # run the workflow when code pushed to main
    branches:
      - master

  pull_request:  # run CI when somebody creates/updates a pull request targeting main
    branches:
      - master

jobs:
  test:

    runs-on: ubuntu-latest #runner

    steps:

      - name: Checkout code
        uses: actions/checkout@v4 # download the Repository into the runner

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        run: |
          python manage.py check

      - name: Run tests
        run: |
          python manage.py test