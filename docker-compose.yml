  services:
    django:
      build: .
      image: poll-app:v3
    
      env_file:
        - .env

      depends_on:
        - postgres
        - redis
      
      volumes:
        - static_data:/app/static
      
    postgres:
      image: postgres:18
      container_name: postgres-dev
      environment:
        - POSTGRES_DB=${DBNAME}
        - POSTGRES_USER=${DBUSER}
        - POSTGRES_PASSWORD=${DBPASSWORD}
        
      env_file:
        - .env
      ports:
        - 5432:5432
      volumes:
        - postgres_data:/var/lib/postgresql
      
    redis:
      image : redis:latest
    
    nginx:
      image: nginx:latest
      volumes:
        - static_data:/static
        - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      ports:
        - 80:80
      depends_on:
        - django


  volumes:
    postgres_data:
    static_data:
